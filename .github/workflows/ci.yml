name: Login Nolc CI
on: {push: {branches: [main]}}
permissions: {contents: read, packages: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t noliae-login .
      - run: docker run -d --name app -p 8084:8080 noliae-login && sleep 2 && curl -fsS http://localhost:8084/api/health | grep -q nolc && docker rm -f app
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }}}
      - uses: docker/build-push-action@v6
        with: {context: ., push: true, tags: ghcr.io/noliae-france/noliae-login:main}
